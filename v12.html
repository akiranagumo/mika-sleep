<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MIKA SLEEP 1.2</title>
<style>:root{color-scheme:dark}*{box-sizing:border-box}body{background:#0b1527;color:#f0e7d8;font-family:system-ui,'Yu Gothic',sans-serif;margin:0;padding:14px}main{max-width:610px;margin:auto;background:linear-gradient(#1d3150,#101b2f);border:1px solid #3b4c67;border-radius:22px;padding:24px 18px}.brand{text-align:center;letter-spacing:3px;color:#dfc799}.moon{width:55px;height:55px;background:#e9cf97;border-radius:50%;margin:20px auto;box-shadow:0 0 40px #d5b56d55;position:relative;overflow:hidden}.moon:after{content:"";position:absolute;width:56px;height:56px;border-radius:50%;left:15px;top:-12px;background:#1a2e4b}h1{text-align:center;font-size:21px;font-weight:400}.phase{text-align:center;color:#bed0e0;margin-top:20px;font-size:15px}#num{font-size:74px;text-align:center;min-height:95px;line-height:1.4;font-variant-numeric:tabular-nums}#sub{min-height:84px;text-align:center;color:#e7d3af;font-size:18px;line-height:1.8}#time{text-align:center;color:#b7c9da;font-size:13px}progress{width:100%;accent-color:#deca99}button{background:#e7d1a7;color:#14233c;border:0;border-radius:27px;padding:15px;cursor:pointer;font-weight:700;font-size:15px;flex:1}button.alt{background:#344660;color:#f4e9da}button:disabled{opacity:.5}.buttons{display:flex;gap:9px;margin:22px 0 12px}label{display:block;margin-top:12px;color:#bdcde0}input{width:100%;accent-color:#d9c291}#status{font-size:13px;color:#cfdaea;white-space:pre-wrap;margin-top:17px;min-height:40px}.note{background:#263a56;border-radius:12px;padding:13px;font-size:13px;color:#d3e0ee;line-height:1.7;margin-top:14px}#status{display:none}.hidden-metrics{display:none}#start{min-height:58px;font-size:17px}#stop[hidden]{display:none}.buttons{margin-top:30px}</style></head><body><main>
<div class="brand">☾ MIKA SLEEP 1.2</div><div class="moon"></div><h1>静かな眠りへ</h1><div class="hidden-metrics" aria-hidden="true"><div id="phase" class="phase">準備中</div><div id="num">☾</div><div id="sub">深呼吸から始め、自然の情景へ。</div><div id="time">00:00</div><progress id="progress" value="0" max="1800"></progress></div>
<div class="buttons"><button id="start" disabled>▶ 睡眠導入をはじめる</button><button class="alt" id="stop" disabled hidden>■ 停止</button></div>
<label>風の環境音　<span id="volumeLabel">16%</span><input id="volume" type="range" min="0" max="100" value="16"></label>
<div id="status">既存のSui音声を準備しています…</div>
</main>
<script>
(()=>{
'use strict';const $=id=>document.getElementById(id), info=s=>$('status').textContent=s;
let ctx,noiseGain,voiceGain,noiseSource,digits,auto,digitSeg,autoSeg,intro=null,introBuf=null,playing=false,mode='ready',phaseAt=0,currentIndex=-1,currentPhrase=-1,raf=0,activeSources=[],total=0;
const fmt=s=>{s=Math.max(0,Math.floor(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
function encodedToBytes(s){const raw=atob(s),bytes=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);return bytes.buffer}
async function initAudio(){if(!ctx){ctx=new (window.AudioContext||window.webkitAudioContext)();voiceGain=ctx.createGain();voiceGain.gain.value=.85;voiceGain.connect(ctx.destination);noiseGain=ctx.createGain();noiseGain.connect(ctx.destination);const b=ctx.createBuffer(1,ctx.sampleRate*3,ctx.sampleRate),d=b.getChannelData(0);let x=0;for(let i=0;i<d.length;i++){x=.986*x+.014*(Math.random()*2-1);d[i]=x*3.8}noiseSource=ctx.createBufferSource();noiseSource.buffer=b;noiseSource.loop=true;const lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=820;noiseSource.connect(lp);lp.connect(noiseGain);noiseSource.start()}volume()}
function volume(){if(!ctx)return;const fade=mode==='tail'?Math.max(0,Math.min(1,(600-(ctx.currentTime-phaseAt))/120)):1;noiseGain.gain.setTargetAtTime(Number($('volume').value)/100*.45*fade,ctx.currentTime,.12)}
function playClip(buf,start=0,length){const a=ctx.createBufferSource();a.buffer=buf;a.connect(voiceGain);a.start(ctx.currentTime,start,length??buf.duration);activeSources.push(a);a.onended=()=>{activeSources=activeSources.filter(s=>s!==a)};return a}
function stopSources(){for(const a of activeSources){try{a.stop()}catch(e){}}activeSources=[]}
const phraseIndex={96:0,91:1,86:2,76:3,71:4,66:5,56:6,46:7,36:8,26:9};
const phrases={96:'右手が重たい',91:'左手も重たい',86:'両足が重たい',76:'右手が温かい',71:'左手も温かい',66:'身体が温かい',56:'呼吸は楽で自然',46:'お腹が温かい',36:'額が涼しい',26:'身体の力が抜けていきます'};
const views=[{text:'今、あなたは美しい自然の中にいます。',at:0},{text:'柔らかな草の上に、ゆったり横たわっています。',at:13},{text:'遠くには、緑に包まれた山々。',at:26},{text:'頬をなでる、とても穏やかな風。',at:39},{text:'日常の忙しさから、少しだけ離れて。',at:52},{text:'考えごとを手放し、静けさを感じてください。',at:65}];
function startPhase(m){mode=m;phaseAt=ctx.currentTime;currentIndex=-1;currentPhrase=-1}
function finish(){playing=false;cancelAnimationFrame(raf);stopSources();if(ctx)noiseGain.gain.setTargetAtTime(0,ctx.currentTime,.3);$('start').disabled=false;$('start').textContent='▶ 睡眠導入をはじめる';$('stop').disabled=true;mode='ready';info('停止しました。いつでもまた始められます。')}
function frame(){if(!playing)return;const t=ctx.currentTime-phaseAt;let elapsed=0;
if(mode==='intro'){elapsed=t;$('phase').textContent='はじめに';$('num').textContent='☾';$('sub').textContent='今は、何も頑張らなくていいですよ。';if(t>=introBuf.duration+.4)startPhase('breath')}
else if(mode==='breath'){elapsed=introBuf.duration+t;const cycle=Math.min(4,Math.floor(t/10)),sec=t%10,inhale=sec<4;$('phase').textContent='呼吸の練習　'+(cycle+1)+' / 5';$('num').textContent=inhale?'吸う':'吐く';$('sub').textContent=(inhale?'4秒かけて、静かに吸います。':'6秒かけて、ゆっくり吐きます。')+'　'+String(Math.floor(inhale?sec:sec-4)+1);if(t>=50)startPhase('nature')}
else if(mode==='nature'){elapsed=introBuf.duration+50+t;$('phase').textContent='自然のイメージ誘導';$('num').textContent='☾';let v=views[0];for(const item of views){if(t>=item.at)v=item}$('sub').textContent=v.text;if(t>=80)startPhase('count')}
else if(mode==='count'){const i=Math.min(100,Math.floor(t/10)),n=100-i,sec=t%10;elapsed=introBuf.duration+130+Math.min(t,1010);$('phase').textContent='自律訓練法とカウント';$('num').textContent=n;$('sub').textContent=phrases[n]||'数字を追わずに、ゆったりと。';if(i!==currentIndex){currentIndex=i;const s=digitSeg[i];if(s)playClip(digits,s.start,Math.min(5.3,s.end-s.start));}
if(Object.prototype.hasOwnProperty.call(phraseIndex,n)&&currentPhrase!==n&&sec>=3.6){currentPhrase=n;const s=autoSeg[phraseIndex[n]];if(s)playClip(auto,s.start,Math.min(5.7,s.end-s.start));}
if(t>=1010)startPhase('tail')}
else if(mode==='tail'){elapsed=introBuf.duration+1140+t;$('phase').textContent='環境音だけの時間';$('num').textContent='☾';$('sub').textContent='そのまま、静かな風を感じてください。';if(t>=600){finish();info('全行程が終わりました。');return}}
total=introBuf.duration+1740;$('time').textContent=fmt(elapsed)+' / '+fmt(total);$('progress').max=total;$('progress').value=elapsed;volume();raf=requestAnimationFrame(frame)}
async function load(){try{const res=await fetch('./index.html',{cache:'no-store'});if(!res.ok)throw Error('既存音声ファイルが見つかりません');const src=await res.text();
const mm=src.match(/const AUDIO_B64='([^']+)'/),am=src.match(/const AUTO_B64="([^"]+)"/),ds=src.match(/const SEGMENTS=(\[[^;]+\]);/),as=src.match(/const AUTO_SEGMENTS=(\[[^;]+\]);/),im=src.match(/<audio id="introAudio"[^>]+src="data:audio\/[^;]+;base64,([^"]+)"/);
if(!(mm&&am&&ds&&as&&im))throw Error('旧バージョンの音声形式が異なります');
digitSeg=JSON.parse(ds[1]);autoSeg=JSON.parse(as[1]);if(digitSeg.length!==101||autoSeg.length!==10)throw Error('音声区間の数が正しくありません');
await initAudio();[digits,auto,introBuf]=await Promise.all([ctx.decodeAudioData(encodedToBytes(mm[1])),ctx.decodeAudioData(encodedToBytes(am[1])),ctx.decodeAudioData(encodedToBytes(im[1]))]);
$('start').disabled=false;info('Sui音声を読み込みました。開始できます。');}catch(e){info('準備に失敗しました：'+e.message+'。以前のVer.1.1は引き続き利用できます。');$('status').style.display='block'}}
$('start').onclick=async()=>{if(playing){finish();return}if(!introBuf)return;await initAudio();await ctx.resume();stopSources();playing=true;startPhase('intro');playClip(introBuf);$('start').textContent='■ 停止する';$('stop').disabled=false;info('導入音声のあと、呼吸練習→自然の情景→101カウントへ進みます。');raf=requestAnimationFrame(frame)};
$('stop').onclick=finish;$('volume').oninput=()=>{$('volumeLabel').textContent=$('volume').value+'%';volume()};load();
})();
</script></body></html>
