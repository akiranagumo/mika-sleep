name: Install Sui countdown introductions
on:
  push:
    paths:
      - '.github/workflows/install-sui-count-intro.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download Japanese and English whispered announcements
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 'https://elevenlabsusercontent.com/database/workspace/25b050645c9741d1b20b9d9fe4b4edab/content_generation/IeBOa6tiEzwSDLHVDndj/FNOXUny2OUOJgV81QNVm/content.mp3?Expires=1794114000&KeyName=assets-cdn-key-1&Signature=vNnvOl3fAOrWNzwAifry94Q7IA4=' -o sui-count-intro-ja.mp3
          curl --fail --location --retry 3 'https://elevenlabsusercontent.com/database/workspace/25b050645c9741d1b20b9d9fe4b4edab/content_generation/BuBKMoblnFfPCEB94foG/WsBAJXn0gLdE4KXgc0Jq/content.mp3?Expires=1794114000&KeyName=assets-cdn-key-1&Signature=kcU0YiLKY_I2Jf4KfsgkFoLrdUI=' -o sui-count-intro-en.mp3
          test $(wc -c < sui-count-intro-ja.mp3) -gt 10000
          test $(wc -c < sui-count-intro-en.mp3) -gt 10000
      - name: Publish both announcements
        run: |
          set -euo pipefail
          cp sui-count-intro-ja.mp3 sui-count-intro-en.mp3 /tmp/
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/sui-count-intro-*.mp3 .
            git add sui-count-intro-ja.mp3 sui-count-intro-en.mp3
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Store whispered JP and EN countdown introductions'
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
