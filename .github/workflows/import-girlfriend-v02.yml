name: Import girlfriend Ver 0.2 dialogue clips
on:
  push:
    paths:
      - '.github/workflows/import-girlfriend-v02.yml'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download four new recorded conversation scenes
        run: |
          curl --fail --location --retry 3 'https://elevenlabsusercontent.com/database/workspace/25b050645c9741d1b20b9d9fe4b4edab/content_generation/J5JUeZsxf8o13DiwunQG/PkkluEK4ZoBvnkMQuF68/content.mp3?Expires=1794038400&KeyName=assets-cdn-key-1&Signature=hAlnhUChP-I6l-9567EmJfcBSWQ=' -o 'girlfriend-v02-01.mp3'
          test $(wc -c < girlfriend-v02-01.mp3) -gt 10000
          curl --fail --location --retry 3 'https://elevenlabsusercontent.com/database/workspace/25b050645c9741d1b20b9d9fe4b4edab/content_generation/KiZClrJ6Whm7qX24gvM7/AVlAlTBWBp9Q8td3f971/content.mp3?Expires=1794038400&KeyName=assets-cdn-key-1&Signature=XIAcv9400MwnJPGhgJ7pLo0U3qo=' -o 'girlfriend-v02-02.mp3'
          test $(wc -c < girlfriend-v02-02.mp3) -gt 10000
          curl --fail --location --retry 3 'https://elevenlabsusercontent.com/database/workspace/25b050645c9741d1b20b9d9fe4b4edab/content_generation/hwCLX7cxw2pvSXp4eGNZ/bSjyq4jIqALnBMfclNqM/content.mp3?Expires=1794038400&KeyName=assets-cdn-key-1&Signature=gOKzIJF3dtBVlKk3S9yCAuhmAGc=' -o 'girlfriend-v02-05.mp3'
          test $(wc -c < girlfriend-v02-05.mp3) -gt 10000
          curl --fail --location --retry 3 'https://elevenlabsusercontent.com/database/workspace/25b050645c9741d1b20b9d9fe4b4edab/content_generation/3E4vbeaeywc0tvedhYbZ/VYtMYwH0kNNuZ5RsNXU8/content.mp3?Expires=1794038400&KeyName=assets-cdn-key-1&Signature=wSQs9U73KTxypaxQFy7V868pXio=' -o 'girlfriend-v02-06.mp3'
          test $(wc -c < girlfriend-v02-06.mp3) -gt 10000
      - name: Commit audio permanently
        run: |
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          git add girlfriend-v02-*.mp3
          git commit -m 'Add new Sui conversational girlfriend scenes for Ver 0.2' || exit 0
          git push
