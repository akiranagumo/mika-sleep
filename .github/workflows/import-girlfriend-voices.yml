name: Import girlfriend companion sleep demo voices
on:
  push:
    paths:
      - '.github/workflows/import-girlfriend-voices.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download 3 Sui girlfriend voice scenes
        run: |
          curl --fail --location --retry 3 'https://elevenlabsusercontent.com/database/workspace/25b050645c9741d1b20b9d9fe4b4edab/content_generation/CazBUTtQ6ElbDXd27qzy/5qpK4TRDJNgeqR5fAAwH/content.mp3?Expires=1794038400&KeyName=assets-cdn-key-1&Signature=UMFs_vsPRIVYVOn1OgkYEeDUTww=' -o 'girlfriend-closer.mp3'
          test $(wc -c < girlfriend-closer.mp3) -gt 10000
          curl --fail --location --retry 3 'https://elevenlabsusercontent.com/database/workspace/25b050645c9741d1b20b9d9fe4b4edab/content_generation/nJ28phGIVVgMsexfkNJR/pTIcveshOEPzu4Om50he/content.mp3?Expires=1794038400&KeyName=assets-cdn-key-1&Signature=XS8Agnem5VX3SrYyeagMkUHwV6I=' -o 'girlfriend-tease.mp3'
          test $(wc -c < girlfriend-tease.mp3) -gt 10000
          curl --fail --location --retry 3 'https://elevenlabsusercontent.com/database/workspace/25b050645c9741d1b20b9d9fe4b4edab/content_generation/otOey06xGuvjEPv4eDmc/W8kJt6vsVPLBLogCIDBd/content.mp3?Expires=1794038400&KeyName=assets-cdn-key-1&Signature=LgdT_DSlIK3K9aZB0L1IhOS2TXc=' -o 'girlfriend-sleep.mp3'
          test $(wc -c < girlfriend-sleep.mp3) -gt 10000
      - name: Commit permanent scene MP3s
        run: |
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          git add girlfriend-*.mp3
          git commit -m 'Add Sui girlfriend sleep scenes for male demo' || exit 0
          git push
