name: Build Sui 30-minute daytime nature immersion
on:
  push:
    paths:
      - '.github/workflows/build-sleepless-day-30.yml'
      - 'scripts/build_sleepless_day_30.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sleepless-day-30
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install static FFmpeg
        run: python -m pip install --disable-pip-version-check imageio-ffmpeg
      - name: Download three public-domain nature field recordings
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.request import Request,urlopen
          import subprocess,time
          import imageio_ffmpeg
          items={
            "day-birds.ogg":"https://upload.wikimedia.org/wikipedia/commons/3/38/Birds_forest.ogg",
            "day-creek.ogg":"https://upload.wikimedia.org/wikipedia/commons/9/9e/Forest_lawn_creek.ogg",
            "day-rain.ogg":"https://upload.wikimedia.org/wikipedia/commons/3/3d/Rain.ogg"
          }
          ffmpeg=imageio_ffmpeg.get_ffmpeg_exe()
          for name,url in items.items():
              dest=Path(name)
              for attempt in range(3):
                  try:
                      request=Request(url,headers={"User-Agent":"SLEEPLESS-Day-Audio/1.0 (audio app; admin contact github.com/akiranagumo)"})
                      with urlopen(request,timeout=45) as resp:dest.write_bytes(resp.read())
                      if dest.stat().st_size<50000:raise ValueError("Too short")
                      print("Real-world recorded nature:",name,dest.stat().st_size,flush=True)
                      break
                  except Exception as e:
                      print("Recording unavailable:",name,str(e),flush=True)
                      if attempt<2:time.sleep(3*(attempt+1))
              else:
                  # Gentle synthesized nature bed fallback. Preserve the real
                  # birds source when available. No sudden digital silence.
                  print("FALLBACK synthetic nature:",name,flush=True)
                  color="brown" if "creek" in name else "pink"
                  subprocess.run([ffmpeg,"-nostdin","-y","-hide_banner","-loglevel","error",
                    "-f","lavfi","-i",f"anoisesrc=color={color}:amplitude=0.35:sample_rate=24000",
                    "-t","120","-c:a","libvorbis","-q:a","2",str(dest)],check=True)
                  assert dest.stat().st_size>50000
          PY
      - name: Prefer CC0 bird, creek and rain effects when accessible
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.request import Request,urlopen
          import subprocess
          import imageio_ffmpeg
          ffmpeg=imageio_ffmpeg.get_ffmpeg_exe()
          options={
            "day-birds.ogg":"https://sfxmint.com/dl/ambience-forest-55.mp3",
            "day-creek.ogg":"https://sfxmint.com/dl/river-ambience-08.mp3",
            "day-rain.ogg":"https://sfxmint.com/dl/ambience-rain-67.mp3"
          }
          for destination,url in options.items():
              try:
                  req=Request(url,headers={"User-Agent":"Mozilla/5.0"})
                  with urlopen(req,timeout=18) as resp:
                      buf=resp.read()
                      ct=resp.headers.get("Content-Type","")
                  if len(buf)<12000 or "html" in ct:
                      raise ValueError("Not playable")
                  tmp=Path(destination+".download.mp3")
                  tmp.write_bytes(buf)
                  reencoded=Path(destination+".checked.ogg")
                  subprocess.run([ffmpeg,"-nostdin","-hide_banner","-loglevel","error","-y",
                    "-i",str(tmp),"-t","120","-ac","1","-ar","24000","-c:a","libvorbis","-q:a","2",str(reencoded)],
                    check=True,timeout=35)
                  if reencoded.stat().st_size<2000:raise ValueError("Not audio")
                  reencoded.replace(destination)
                  print("Installed CC0 effect",destination,len(buf),flush=True)
              except Exception as e:
                  print("Keeping synthetic fallback",destination,str(e),flush=True)
          PY
      - name: Master two balanced / rich-nature 30-minute Sui tracks
        run: python scripts/build_sleepless_day_30.py
      - name: Commit MP3 masters and source recordings
        run: |
          set -euo pipefail
          mkdir -p /tmp/sui30
          cp sleepless-day-30-*.mp3 day-*.ogg /tmp/sui30/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/sui30/* .
            git add sleepless-day-30-*.mp3 day-*.ogg
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Publish 30-minute Sui rest with nature field recordings'
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
