name: Install Sui comfort whisper prompts
on:
  push:
    paths:
      - '.github/workflows/install-sui-comfort-whispers.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Fetch whisper-only reassurance recording
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 'https://elevenlabsusercontent.com/database/workspace/25b050645c9741d1b20b9d9fe4b4edab/content_generation/Tte1nfvWFupwL2HNNzDA/IZaVmUwwQvNImWeMYhzm/content.mp3?Expires=1794103200&KeyName=assets-cdn-key-1&Signature=CTCiuiccbhJuJGddXrI2MJvE3A4=' -o sui-comfort-whispers-v2.mp3
          test $(wc -c < sui-comfort-whispers-v2.mp3) -gt 100000
          python - <<'PY'
          import json,subprocess
          info=json.loads(subprocess.check_output([
            'ffprobe','-v','error','-show_format','-of','json','sui-comfort-whispers-v2.mp3']))['format']
          length=float(info['duration'])
          words=json.load(open('sui-comfort-whispers-v2-segments.json',encoding='utf-8'))
          assert 44 < length < 47, length
          assert len(words)==14
          assert all(w['id']==i and 0<=w['start']<w['end']<length+0.3 for i,w in enumerate(words))
          print('Verified 14 Sui whisper phrases, duration:',length)
          PY
      - name: Publish recording to GitHub Pages
        run: |
          set -euo pipefail
          cp sui-comfort-whispers-v2.mp3 /tmp/sui-comfort-whispers-v2.mp3
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/sui-comfort-whispers-v2.mp3 .
            git add sui-comfort-whispers-v2.mp3
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Store Sui whispered reassurance phrases for countdown'
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
