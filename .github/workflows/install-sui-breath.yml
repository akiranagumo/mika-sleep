name: Install Sui breath audio
on:
  push:
    paths:
      - '.github/workflows/install-sui-breath.yml'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Sui voice audio
        env:
          INHALE_URL: 'https://elevenlabsusercontent.com/database/workspace/25b050645c9741d1b20b9d9fe4b4edab/content_generation/PoCP7SJMCk34bbUHHY8e/3Zcq5ysG7JnvZePh75ZX/content.mp3?Expires=1794027600&KeyName=assets-cdn-key-1&Signature=5gqjwmhaQV9ulUlwVKTjdBlnbpQ='
          EXHALE_URL: 'https://elevenlabsusercontent.com/database/workspace/25b050645c9741d1b20b9d9fe4b4edab/content_generation/BcfmayIRnc3N3BsXKaXj/xOnTAM3PEPJIuAg1LZbZ/content.mp3?Expires=1794027600&KeyName=assets-cdn-key-1&Signature=i1ySz-ac8w8g68exQkDpgJcxKM0='
        run: |
          curl --fail --location --retry 3 "$INHALE_URL" -o sui-inhale.mp3
          curl --fail --location --retry 3 "$EXHALE_URL" -o sui-exhale.mp3
          test $(wc -c < sui-inhale.mp3) -gt 1000
          test $(wc -c < sui-exhale.mp3) -gt 1000
      - name: Commit permanent Sui MP3 files
        run: |
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          git add sui-inhale.mp3 sui-exhale.mp3
          git commit -m 'Store Sui inhale and exhale narration' || exit 0
          git push
