name: Install genuine Sui V4 whispered JP and EN countdown recordings
on:
  push:
    paths:
      - '.github/workflows/install-sui-whisper-v4.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Fetch verified Sui 100-to-0 whisper recordings from ElevenLabs
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json,time,urllib.request
          segments=[]
          for part in range(4):
              segments+=json.loads(Path(f'sui-v4-whisper-manifest-part{part}.json').read_text())
          assert len(segments)==22,len(segments)
          for lang in ('ja','en'):
              a=[s for s in segments if s['lang']==lang]
              assert len(a)==11
              assert sorted(x['block'] for x in a)==list(range(11))
              order=[c['n'] for b in sorted(a,key=lambda x:x['block']) for c in b['clips']]
              assert order==list(range(100,-1,-1)),(lang,order)
              for s in a:
                  assert len(s['clips'])==s['first']-s['last']+1
                  assert all(0<=c['start']<c['end']<=s['duration']+.01 for c in s['clips'])
                  assert all(s['clips'][i]['end']<=s['clips'][i+1]['start'] for i in range(len(s['clips'])-1))
          for s in segments:
              name=f"sui-whisper-v4-{s['lang']}-b{s['block']:02d}.mp3"
              for attempt in range(4):
                  try:
                      req=urllib.request.Request(s['url'],headers={'User-Agent':'AKIRA-SLEEP-audio-builder'})
                      with urllib.request.urlopen(req,timeout=60) as response:
                          content=response.read()
                      Path(name).write_bytes(content)
                      break
                  except Exception as exc:
                      print('retry',name,attempt,str(exc),flush=True)
                      if attempt==3:raise
                      time.sleep(attempt+2)
              assert Path(name).stat().st_size>10000,name
              print(name,'bytes',Path(name).stat().st_size,flush=True)
          print('Verified all 202 Japanese and English Sui whispered count word intervals',flush=True)
          PY
      - name: Commit the 22 complete original Sui V4 performances
        run: |
          set -euo pipefail
          mkdir -p /tmp/sui-v4-words
          cp sui-whisper-v4-*.mp3 /tmp/sui-v4-words/
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/sui-v4-words/*.mp3 .
            git add sui-whisper-v4-*.mp3
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Store verified Sui V4 Japanese/English genuine whisper countdowns'
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
