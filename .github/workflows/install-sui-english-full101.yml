name: Install unified English 100 to zero Sui recording
on:
  push:
    paths:
      - '.github/workflows/install-sui-english-full101.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download one-pass Sui whispered 100-to-0 source
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 'https://elevenlabsusercontent.com/database/workspace/25b050645c9741d1b20b9d9fe4b4edab/content_generation/Qw7Rnpxv9Wo6jjf951Ek/5rwvdY6bB4x7MJkunQZI/content.mp3?Expires=1794117600&KeyName=assets-cdn-key-1&Signature=AkcWdD78u_AZO4ls69Mf_J3hQ24=' -o sui-english-full101.mp3
          test $(wc -c < sui-english-full101.mp3) -gt 500000
          python - <<'PY'
          import json
          a=json.load(open('sui-english-full101-segments.json'))
          assert len(a)==101 and all(x['n']==100-i for i,x in enumerate(a))
          assert all(0<x['start']<x['end']<132 for x in a)
          assert all(a[i]['start']>=a[i-1]['end']-.03 for i in range(1,len(a)))
          print('101 English numbers validated, in consecutive order')
          PY
      - name: Publish verified source
        run: |
          set -euo pipefail
          cp sui-english-full101.mp3 /tmp/
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/sui-english-full101.mp3 .
            git add sui-english-full101.mp3
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Store complete uninterrupted Sui English 100-to-zero source'
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
