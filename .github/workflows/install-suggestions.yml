name: Install new sleep suggestions
on:
  push:
    paths:
      - '.github/workflows/install-suggestions.yml'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Sui whisper suggestions
        run: |
          curl --fail --location --retry 3 'https://elevenlabsusercontent.com/database/workspace/25b050645c9741d1b20b9d9fe4b4edab/content_generation/jXO8wWXJcCKu9MqgsW0s/JoKtxrrToXqTLLCgYbgB/content.mp3?Expires=1794034800&KeyName=assets-cdn-key-1&Signature=zfnm2OOyfqCw9-ZPlKMX4OfFD5Q=' -o 'sui-suggestion-eyelids.mp3'
          test $(wc -c < sui-suggestion-eyelids.mp3) -gt 1000
          curl --fail --location --retry 3 'https://elevenlabsusercontent.com/database/workspace/25b050645c9741d1b20b9d9fe4b4edab/content_generation/f7aGFnG15xk57MpSRj01/qL1H6EaagXmM8dPLsEBh/content.mp3?Expires=1794034800&KeyName=assets-cdn-key-1&Signature=lK3RZ2EsPuVb_LF0j2QuyPnz7RI=' -o 'sui-suggestion-body.mp3'
          test $(wc -c < sui-suggestion-body.mp3) -gt 1000
          curl --fail --location --retry 3 'https://elevenlabsusercontent.com/database/workspace/25b050645c9741d1b20b9d9fe4b4edab/content_generation/VxkyfMnnhulR6i5gYFJk/fjGLrqFz8K1BN8psj7Bz/content.mp3?Expires=1794034800&KeyName=assets-cdn-key-1&Signature=gcadB1AAhlvNaz5wL8dJxH1zv8c=' -o 'sui-suggestion-thoughts.mp3'
          test $(wc -c < sui-suggestion-thoughts.mp3) -gt 1000
          curl --fail --location --retry 3 'https://elevenlabsusercontent.com/database/workspace/25b050645c9741d1b20b9d9fe4b4edab/content_generation/EhagghZsxy3ox0FWvBw6/MyMI3RJhDePWCDn2w5E8/content.mp3?Expires=1794034800&KeyName=assets-cdn-key-1&Signature=7Wi4lYqyRuyG9r_UqLelyzMBCjk=' -o 'sui-suggestion-rest.mp3'
          test $(wc -c < sui-suggestion-rest.mp3) -gt 1000
      - name: Commit permanent suggestions
        run: |
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          git add sui-suggestion-*.mp3
          git commit -m 'Store four Sui relaxing sleep suggestions' || exit 0
          git push
