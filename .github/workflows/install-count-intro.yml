name: Install Sui count introduction
on:
  push:
    paths:
      - '.github/workflows/install-count-intro.yml'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch recording
        run: |
          curl --fail --location --retry 3 'https://elevenlabsusercontent.com/database/workspace/25b050645c9741d1b20b9d9fe4b4edab/content_generation/I5Pn16QQw3z5hRPQcpU8/NCt265JkgArdBUU0fENb/content.mp3?Expires=1794027600&KeyName=assets-cdn-key-1&Signature=fVekNWGBWwMKRuxcFweMryKNr9s=' -o sui-count-intro.mp3
          test $(wc -c < sui-count-intro.mp3) -gt 1000
      - name: Commit permanent audio
        run: |
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          git add sui-count-intro.mp3
          git commit -m 'Add Sui spoken introduction to countdown' || exit 0
          git push
