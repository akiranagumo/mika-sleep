name: Diagnose Sui raw count volume
on:
  push:
    paths:
      - '.github/workflows/diagnose-sui-numbers.yml'
  workflow_dispatch:
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose raw Sui digits
        run: |
          python - <<'PY'
          import json,subprocess,math
          from array import array
          for lang in ('english','japanese'):
              path='sui-'+lang+'-full101.mp3'
              meta=json.load(open('sui-'+lang+'-full101-segments.json'))
              wav=subprocess.check_output(['ffmpeg','-hide_banner','-loglevel','error','-i',path,'-ac','1','-ar','32000','-f','s16le','pipe:1'])
              samples=array('h')
              samples.frombytes(wav)
              stats=[]
              for row in meta:
                  start,end=row['start'],row['end']
                  chunk=samples[int(32000*start):int(32000*end)]
                  rms=(math.sqrt(sum(x*x for x in chunk)/len(chunk))/32768) if chunk else 0
                  stats.append((row['n'],row['reading'],round(rms,6),round(end-start,3)))
              print('Language:',lang,flush=True)
              print('LOWEST 35:',sorted(stats,key=lambda x:x[2])[:35],flush=True)
              print('COUNT BELOW .003:',[row for row in stats if row[2]<.003],flush=True)
          PY
