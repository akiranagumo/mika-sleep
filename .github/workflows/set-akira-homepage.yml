name: Point homepage to AKIRA SLEEP
on:
  push:
    paths:
      - '.github/workflows/set-akira-homepage.yml'
permissions:
  contents: write
jobs:
  redirect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Redirect homepage while keeping bundled Sui audio intact
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          data=p.read_text(encoding="utf-8")
          script="<script>window.location.replace('./v12.html');</script>"
          if script not in data:
              if "<head>" in data:
                  data=data.replace("<head>","<head>"+script,1)
              elif "<HEAD>" in data:
                  data=data.replace("<HEAD>","<HEAD>"+script,1)
              else:
                  data=script+data
              p.write_text(data,encoding="utf-8")
          print("Homepage updated; embedded audio preserved:", len(data))
          PY
      - name: Commit homepage routing
        run: |
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          git add index.html
          git commit -m 'Make AKIRA SLEEP the homepage' || exit 0
          git push
