name: Add AKIRA SLEEP v1.1 suggestion voices
on:
  push:
    paths:
      - '.github/workflows/install-more-suggestions.yml'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download varied Sui whispers
        run: |
          curl --fail --location --retry 3 'https://elevenlabsusercontent.com/database/workspace/25b050645c9741d1b20b9d9fe4b4edab/content_generation/orG6eKOxxAWjDSdPp5vO/XX1df6hSzOm7Fzyz6Uen/content.mp3?Expires=1794034800&KeyName=assets-cdn-key-1&Signature=MvjBL0dhX_zqBR7F_yemFGwPStg=' -o 'sui-suggestion-restmore.mp3'
          test $(wc -c < sui-suggestion-restmore.mp3) -gt 1000
          curl --fail --location --retry 3 'https://elevenlabsusercontent.com/database/workspace/25b050645c9741d1b20b9d9fe4b4edab/content_generation/52nqiRs2c0QxG9DOfKSE/FiTq9cae3zWoHLVvGm9O/content.mp3?Expires=1794034800&KeyName=assets-cdn-key-1&Signature=VT_OZD7fHiOwYJ2ovC4a9cEF2aI=' -o 'sui-suggestion-quiet.mp3'
          test $(wc -c < sui-suggestion-quiet.mp3) -gt 1000
          curl --fail --location --retry 3 'https://elevenlabsusercontent.com/database/workspace/25b050645c9741d1b20b9d9fe4b4edab/content_generation/B7LteRUdykB2YTGHhPLi/zwL8fKcpm9HQ7ibUHTX5/content.mp3?Expires=1794034800&KeyName=assets-cdn-key-1&Signature=pHdlt7e7VbikbTACOdij2Rn8elM=' -o 'sui-suggestion-effort.mp3'
          test $(wc -c < sui-suggestion-effort.mp3) -gt 1000
          curl --fail --location --retry 3 'https://elevenlabsusercontent.com/database/workspace/25b050645c9741d1b20b9d9fe4b4edab/content_generation/OliqTvGsAeJhI5ySYrb8/MK7bU7X2x9m1KvvRRJXA/content.mp3?Expires=1794034800&KeyName=assets-cdn-key-1&Signature=gnX4vHcoJjj76JQfFoON3uJ4Avc=' -o 'sui-suggestion-sink.mp3'
          test $(wc -c < sui-suggestion-sink.mp3) -gt 1000
          curl --fail --location --retry 3 'https://elevenlabsusercontent.com/database/workspace/25b050645c9741d1b20b9d9fe4b4edab/content_generation/I9P094b9BDSPt2wyAYHU/eI8S3WE1f2j02AF2YNMo/content.mp3?Expires=1794034800&KeyName=assets-cdn-key-1&Signature=zgwUiGJcItAOBpjWN3AwLATaiBc=' -o 'sui-suggestion-flow.mp3'
          test $(wc -c < sui-suggestion-flow.mp3) -gt 1000
          curl --fail --location --retry 3 'https://elevenlabsusercontent.com/database/workspace/25b050645c9741d1b20b9d9fe4b4edab/content_generation/Z4UppeucPBKT98bhpFtq/7yyTHHoOPTholOraYfhX/content.mp3?Expires=1794034800&KeyName=assets-cdn-key-1&Signature=6Wd-OyQNr_zjEqc1Nmsyngvy5dM=' -o 'sui-suggestion-safe.mp3'
          test $(wc -c < sui-suggestion-safe.mp3) -gt 1000
      - name: Commit all six clips
        run: |
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          git add sui-suggestion-*.mp3
          git commit -m 'Add six varied Sui whispers for v1.1' || exit 0
          git push
