name: Install Sui no-thinking whisper
on:
  push:
    paths:
      - '.github/workflows/install-no-thinking-whisper.yml'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Sui no-thinking whisper
        run: |
          curl --fail --location --retry 3 'https://elevenlabsusercontent.com/database/workspace/25b050645c9741d1b20b9d9fe4b4edab/content_generation/8BopUVohvYca5ZzlDWej/OzzbSmswodJWAAenulRZ/content.mp3?Expires=1794034800&KeyName=assets-cdn-key-1&Signature=HOlUSBROF_xwcEHpIqvYwYYfm2k=' -o sui-suggestion-nothinking.mp3
          test $(wc -c < sui-suggestion-nothinking.mp3) -gt 1000
      - name: Commit permanent sound
        run: |
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          git add sui-suggestion-nothinking.mp3
          git commit -m 'Add Sui whisper no need to think' || exit 0
          git push
