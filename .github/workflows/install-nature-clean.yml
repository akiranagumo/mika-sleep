name: Install revised moonlight voice
on:
  push:
    paths:
      - '.github/workflows/install-nature-clean.yml'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch revised moonlit Sui narration
        run: |
          curl --fail --location --retry 3 'https://elevenlabsusercontent.com/database/workspace/25b050645c9741d1b20b9d9fe4b4edab/content_generation/L54Q5uCL5ijdMOfjFErK/KUDKcl4fFKnxVxpKvn0t/content.mp3?Expires=1794034800&KeyName=assets-cdn-key-1&Signature=nD8WLEQcGyEu-pof2v1txsAryYI=' -o sui-nature-night-clean.mp3
          test $(wc -c < sui-nature-night-clean.mp3) -gt 10000
      - name: Commit sound asset
        run: |
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          git add sui-nature-night-clean.mp3
          git commit -m 'Save revised soft moonlit narration' || exit 0
          git push
