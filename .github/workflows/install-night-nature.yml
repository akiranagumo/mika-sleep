name: Install nighttime nature voice
on:
  push:
    paths:
      - '.github/workflows/install-night-nature.yml'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Sui nighttime nature narration
        run: |
          curl --fail --location --retry 3 'https://elevenlabsusercontent.com/database/workspace/25b050645c9741d1b20b9d9fe4b4edab/content_generation/mOVkx6P3HwjIye5enU2S/9S6tJdIfwoIrLxwrQlB2/content.mp3?Expires=1794031200&KeyName=assets-cdn-key-1&Signature=fDFFwn9bDvof-z1qqqw8CEdDX8E=' -o sui-nature-night.mp3
          test $(wc -c < sui-nature-night.mp3) -gt 1000
      - name: Commit permanent night recording
        run: |
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          git add sui-nature-night.mp3
          git commit -m 'Add Sui nighttime nature visualization' || exit 0
          git push
