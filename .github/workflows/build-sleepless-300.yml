name: Build SLEEPLESS 300 all-Sui whispered modes
on:
  push:
    paths:
      - '.github/workflows/build-sleepless-300.yml'
      - 'scripts/build_sleepless_300.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sleepless-300-audio
  cancel-in-progress: true
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install MP3 encoder and scientific dependencies
        run: |



          python -m pip install --disable-pip-version-check "numpy>=1.26,<3" "imageio-ffmpeg>=0.6"
      - name: Download four Sui V4 genuine whisper source recordings
        run: |
          python - <<'PY'
          import urllib.request
          from pathlib import Path
          sources={
            "sui-300-300-clean-v4.mp3":"https://elevenlabsusercontent.com/database/workspace/25b050645c9741d1b20b9d9fe4b4edab/content_generation/Z4JAOY6zIEFNq3crXYgE/VSBtXmx933risr5SAjyo/content.mp3?Expires=1795197600&KeyName=assets-cdn-key-1&Signature=A-5SrB7Jn6LK755dO1B0RGcyDZ8=",
            "sui-300-intro-informal-v3.mp3":"https://elevenlabsusercontent.com/database/workspace/25b050645c9741d1b20b9d9fe4b4edab/content_generation/6MQaT0gYHsEgVehte7JT/K3zDJvGeOSbXsWf677Qu/content.mp3?Expires=1795197600&KeyName=assets-cdn-key-1&Signature=I9-yCHVlmFL3yTDVQVG8-xtzvxA=",
            "sui-300-breath-informal-v3.mp3":"https://elevenlabsusercontent.com/database/workspace/25b050645c9741d1b20b9d9fe4b4edab/content_generation/j8O72p0iFCBRQJKZ6LAc/ij6f1W8V831NrjzyaBjT/content.mp3?Expires=1795197600&KeyName=assets-cdn-key-1&Signature=D1e_N8Ws3jlMoI0xWk_N-v5bkwQ=",
            "sui-300-love-informal-v3.mp3":"https://elevenlabsusercontent.com/database/workspace/25b050645c9741d1b20b9d9fe4b4edab/content_generation/pJuGuXuZwaXKQ7jmQBmx/9EgBR9E7DDK6R2Iw6VIh/content.mp3?Expires=1795197600&KeyName=assets-cdn-key-1&Signature=xoZJBgGJnNAjnzBVAsKCrixuZLE=",
            "sui-300-cuddle-informal-v3.mp3":"https://elevenlabsusercontent.com/database/workspace/25b050645c9741d1b20b9d9fe4b4edab/content_generation/IRfBKIReWeNJCG8cOV5R/aCvufpCrLnODLQORuQNt/content.mp3?Expires=1795197600&KeyName=assets-cdn-key-1&Signature=QWRqr0imgVSejCZadi0uWY9dCnw=",
            "sui-300-suggestion-informal-v3.mp3":"https://elevenlabsusercontent.com/database/workspace/25b050645c9741d1b20b9d9fe4b4edab/content_generation/zJk954NhKAXObK7yf1g2/JFdftmpGoAJas1Cu0c8x/content.mp3?Expires=1795197600&KeyName=assets-cdn-key-1&Signature=22JLGrdyxHPWYniD3Qsvh7aUZyU=",
            "sui-300-love-short-informal-v3.mp3":"https://elevenlabsusercontent.com/database/workspace/25b050645c9741d1b20b9d9fe4b4edab/content_generation/Q7j8A7sApHbgfjKG5x2L/33oHvpkkqxSShfAQWhy2/content.mp3?Expires=1795197600&KeyName=assets-cdn-key-1&Signature=ChiOC40jPmZMwyzpCH2dKNtzjec=",
            "sui-300-cuddle-short-v3.mp3":"https://elevenlabsusercontent.com/database/workspace/25b050645c9741d1b20b9d9fe4b4edab/content_generation/hU2zsDqWU5XlUHF6P4Qa/f4JKA3Me6e3PSqNyr7XN/content.mp3?Expires=1795197600&KeyName=assets-cdn-key-1&Signature=70REJnfE7FlepyMVztOAsGBBV88=",
            "sui-300-suggestion-short-v3.mp3":"https://elevenlabsusercontent.com/database/workspace/25b050645c9741d1b20b9d9fe4b4edab/content_generation/b31yosPFQuNzF3vf7u4s/96IzhvPHJzvXI5ENYoAl/content.mp3?Expires=1795197600&KeyName=assets-cdn-key-1&Signature=0r4dsq-Av7lXE1OEm0Gb8zwAYKg=",
          }
          for name,url in sources.items():
              request=urllib.request.Request(url,headers={"User-Agent":"SLEEPLESS-300-SUI"})
              with urllib.request.urlopen(request,timeout=80) as response:
                  Path(name).write_bytes(response.read())
              assert Path(name).stat().st_size > 5000,name
              print(name,Path(name).stat().st_size,flush=True)
          PY
      - name: Render and validate 301 Sui whispers in all six variants
        run: python scripts/build_sleepless_300.py
      - name: Commit mastered MP3 files and count-position manifests
        run: |
          set -euo pipefail
          mkdir -p /tmp/sleepless300
          cp sleepless-300-{mix,lover,cuddle,suggestion,love,numbers}.{mp3,json} /tmp/sleepless300/
          cp sui-300-*.mp3 /tmp/sleepless300/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/sleepless300/* .
            git add sleepless-300-*.mp3 sleepless-300-*.json sui-300-*.mp3
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Publish six complete Sui whispered SLEEPLESS 300 sleep masters'
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
