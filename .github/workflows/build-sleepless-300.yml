name: Build SLEEPLESS 300 all-Sui whispered modes
on:
  push:
    paths:
      - '.github/workflows/build-sleepless-300.yml'
      - 'scripts/build_sleepless_300.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sleepless-300-audio
  cancel-in-progress: true
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install MP3 encoder and scientific dependencies
        run: |
          command -v ffmpeg
          command -v ffprobe
          pip install --disable-pip-version-check "numpy>=1.26,<3"
      - name: Download four Sui V4 genuine whisper source recordings
        run: |
          python - <<'PY'
          import urllib.request
          from pathlib import Path
          sources={
            "sui-300-intro-heartfelt-v2.mp3":"https://elevenlabsusercontent.com/database/workspace/25b050645c9741d1b20b9d9fe4b4edab/content_generation/Outx02lEs89AzXMDIhhk/MKGx3iZPVpUK0T62TOID/content.mp3?Expires=1795194000&KeyName=assets-cdn-key-1&Signature=VD9oJuoHH4dHpEDIq5fdrTS2BLc=",
            "sui-300-love-v2.mp3":"https://elevenlabsusercontent.com/database/workspace/25b050645c9741d1b20b9d9fe4b4edab/content_generation/9uXIO2R7SncCsUWr5e5W/gDHx45V6l0MEAcOMMze2/content.mp3?Expires=1795194000&KeyName=assets-cdn-key-1&Signature=eUdAM8b1pymKX4ELs1jmbotB0sA=",
            "sui-300-love-short-v2.mp3":"https://elevenlabsusercontent.com/database/workspace/25b050645c9741d1b20b9d9fe4b4edab/content_generation/v5Q3bQBZ1XUGKCwTsve1/Ii62M7iSibujFyKdR9oA/content.mp3?Expires=1795194000&KeyName=assets-cdn-key-1&Signature=5ug2XBMjn-I0oOtJO_GZwNk-Kn0=",
            "sui-300-intro-preview.mp3":"https://elevenlabsusercontent.com/database/workspace/25b050645c9741d1b20b9d9fe4b4edab/content_generation/SXDlpZeCJtVuUuAVlhU6/lCCxkEb22tPXtN3Bj1GU/content.mp3?Expires=1795186800&KeyName=assets-cdn-key-1&Signature=fvAhYr9kc51-8dQZyjn5hq8V2HA=",
            "sui-300-prefix-200.mp3":"https://elevenlabsusercontent.com/database/workspace/25b050645c9741d1b20b9d9fe4b4edab/content_generation/taBPv4OuNlnuaQsZeFBM/2MX6AiY5DvxXwNuMJ8rV/content.mp3?Expires=1795186800&KeyName=assets-cdn-key-1&Signature=aX4hAUtayFysww0KBZ0fzJGWsEI=",
            "sui-300-prefix-300.mp3":"https://elevenlabsusercontent.com/database/workspace/25b050645c9741d1b20b9d9fe4b4edab/content_generation/2G6poLcdl6iomRJt6KQP/Gr4g4ALMxXsudT74MBiK/content.mp3?Expires=1795186800&KeyName=assets-cdn-key-1&Signature=4rGuAEbKoPl8eXWqb2qh8X5YKO0=",
            "sui-300-love.mp3":"https://elevenlabsusercontent.com/database/workspace/25b050645c9741d1b20b9d9fe4b4edab/content_generation/8rHmuZwmWBQoDRBSe9iM/cmTN9GgxuNLRxtn98H5k/content.mp3?Expires=1795186800&KeyName=assets-cdn-key-1&Signature=vi4c7h6YY8c1NiipI9_5j9V7Jic="
          }
          for name,url in sources.items():
              request=urllib.request.Request(url,headers={"User-Agent":"SLEEPLESS-300-SUI"})
              with urllib.request.urlopen(request,timeout=80) as response:
                  Path(name).write_bytes(response.read())
              assert Path(name).stat().st_size > 5000,name
              print(name,Path(name).stat().st_size,flush=True)
          PY
      - name: Render and validate 301 Sui whispers in all six variants
        run: python scripts/build_sleepless_300.py
      - name: Commit mastered MP3 files and count-position manifests
        run: |
          set -euo pipefail
          mkdir -p /tmp/sleepless300
          cp sleepless-300-{mix,lover,cuddle,suggestion,love,numbers}.{mp3,json} /tmp/sleepless300/
          cp sui-300-{intro-preview,prefix-200,prefix-300,love,intro-heartfelt-v2,love-v2,love-short-v2}.mp3 /tmp/sleepless300/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/sleepless300/* .
            git add sleepless-300-*.mp3 sleepless-300-*.json sui-300-*.mp3
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Publish six complete Sui whispered SLEEPLESS 300 sleep masters'
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
