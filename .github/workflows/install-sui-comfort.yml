name: Install Sui breathing comfort note
on:
  push:
    paths:
      - '.github/workflows/install-sui-comfort.yml'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Sui comfort narration
        run: |
          curl --fail --location --retry 3 'https://elevenlabsusercontent.com/database/workspace/25b050645c9741d1b20b9d9fe4b4edab/content_generation/4rLOsfbdwmogxbtZwb0w/yuhk0NR8gcaKmMQ14u4K/content.mp3?Expires=1794031200&KeyName=assets-cdn-key-1&Signature=b0m5AhwmnwODmj_jXfPGxQ-Av-E=' -o sui-comfort.mp3
          test $(wc -c < sui-comfort.mp3) -gt 1000
      - name: Commit audio
        run: |
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          git add sui-comfort.mp3
          git commit -m 'Add gentle Sui breathing comfort note' || exit 0
          git push
