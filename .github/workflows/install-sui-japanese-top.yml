name: Install Japanese Sui 100-90 source
on:
  push:
    paths:
      - '.github/workflows/install-sui-japanese-top.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download Japanese whispered 100-90 source
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 'https://elevenlabsusercontent.com/database/workspace/25b050645c9741d1b20b9d9fe4b4edab/content_generation/VtpbUHlQCrqGwf4j2bf6/NnMKL1IfRt2arUR6MU8k/content.mp3?Expires=1794114000&KeyName=assets-cdn-key-1&Signature=tIBjHgUbE4Qqp1uKVmEkZzsaQ90=' -o sui-japanese-top.mp3
          test $(wc -c < sui-japanese-top.mp3) -gt 100000
          python - <<'PY'
          import json
          spans=json.load(open('sui-japanese-top-segments.json'))
          assert len(spans)==11 and all(s['n']==100-i for i,s in enumerate(spans))
          assert all(0<=s['start']<s['end']<=16.33 for s in spans)
          PY
      - name: Publish recording
        run: |
          set -euo pipefail
          cp sui-japanese-top.mp3 /tmp/sui-japanese-top.mp3
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/sui-japanese-top.mp3 .
            git add sui-japanese-top.mp3
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Store Sui 100-to-90 Japanese whisper recording'
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
