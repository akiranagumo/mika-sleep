name: Install unified Sui whisper intro and breathing
on:
  push:
    paths:
      - '.github/workflows/install-sui-full-whisper.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Download six Sui whisper clips
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 'https://elevenlabsusercontent.com/database/workspace/25b050645c9741d1b20b9d9fe4b4edab/content_generation/LC1Xn7l2tBa1GkyNiZ3E/SbJhkzeXCxWxNE4LwN39/content.mp3?Expires=1794114000&KeyName=assets-cdn-key-1&Signature=CTTFxcx0I4ip57I-yXceobNX7DM=' -o 'sui-v139-opening.mp3'
          test $(wc -c < sui-v139-opening.mp3) -gt 10000
          curl --fail --silent --show-error --location --retry 3 'https://elevenlabsusercontent.com/database/workspace/25b050645c9741d1b20b9d9fe4b4edab/content_generation/90l1dXcwGQ7UuDMIdubN/nkkdfOXrCBfArVjVOnFb/content.mp3?Expires=1794114000&KeyName=assets-cdn-key-1&Signature=LMaz78GMbQrymSmqkQ63OiJHG2o=' -o 'sui-v139-breath-guide.mp3'
          test $(wc -c < sui-v139-breath-guide.mp3) -gt 10000
          curl --fail --silent --show-error --location --retry 3 'https://elevenlabsusercontent.com/database/workspace/25b050645c9741d1b20b9d9fe4b4edab/content_generation/oL02HqE4bSfFw8fOUviB/cmoUwC1z0tQo28F37nD5/content.mp3?Expires=1794114000&KeyName=assets-cdn-key-1&Signature=3LrOoyaamK6ToAF6c1IlLJYV2cw=' -o 'sui-v139-inhale.mp3'
          test $(wc -c < sui-v139-inhale.mp3) -gt 10000
          curl --fail --silent --show-error --location --retry 3 'https://elevenlabsusercontent.com/database/workspace/25b050645c9741d1b20b9d9fe4b4edab/content_generation/qXE7jDGU96bzaf2xG8Wm/fsuDuWNizOvai3w1UuPl/content.mp3?Expires=1794114000&KeyName=assets-cdn-key-1&Signature=Q1Buuide8ET0uizVhC_E5AN1v-I=' -o 'sui-v139-exhale.mp3'
          test $(wc -c < sui-v139-exhale.mp3) -gt 10000
          curl --fail --silent --show-error --location --retry 3 'https://elevenlabsusercontent.com/database/workspace/25b050645c9741d1b20b9d9fe4b4edab/content_generation/ioZHEYYWvN7PCKZURYLS/62qED4IMWHRUH8EDSxwR/content.mp3?Expires=1794114000&KeyName=assets-cdn-key-1&Signature=rGgOBxlIaQuulqsSS-D8gdZLrms=' -o 'sui-v139-repeat.mp3'
          test $(wc -c < sui-v139-repeat.mp3) -gt 10000
          curl --fail --silent --show-error --location --retry 3 'https://elevenlabsusercontent.com/database/workspace/25b050645c9741d1b20b9d9fe4b4edab/content_generation/Fd53lgVyCGemKNXvTbLU/pFhowXPiEsTYBElyfxNK/content.mp3?Expires=1794114000&KeyName=assets-cdn-key-1&Signature=s_dAmz6TukMPQGrgtjIwJLcQxN4=' -o 'sui-v139-nature.mp3'
          test $(wc -c < sui-v139-nature.mp3) -gt 10000
      - name: Publish new intro recordings
        run: |
          set -euo pipefail
          cp sui-v139-*.mp3 /tmp/
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/sui-v139-*.mp3 .
            git add sui-v139-*.mp3
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Install Sui whisper-only opening, breath cues and nature'
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
