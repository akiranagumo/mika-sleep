name: Build continuous Sui background sleep audio
on:
  push:
    paths:
      - '.github/workflows/build-background-audio.yml'
      - 'scripts/build_background_audio.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout audio sources
        uses: actions/checkout@v4
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install audio builder dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install --disable-pip-version-check 'numpy>=1.26,<3'
          ffmpeg -version | head -n 1
      - name: Render full 32-minute background playback file
        run: |
          set -o pipefail
          python scripts/build_background_audio.py 2>&1 | tee build-background-debug.txt
      - name: Validate MP3 has expected length and non-silent speech
        run: |
          python - <<'PY'
          import json, subprocess
          paths = ['sleep-background-full.mp3','sleep-background-wind-02.mp3',
                   'sleep-background-wind-05.mp3','sleep-background-wind-10.mp3',
                   'sleep-background-wind-20.mp3']
          durations = []
          for filename in paths:
              info = json.loads(subprocess.check_output(
                  ['ffprobe','-v','error','-show_format','-of','json',filename]))['format']
              duration = float(info['duration'])
              assert 1850 < duration < 2100, f'Unexpected duration for {filename}: {duration}'
              assert int(info['size']) > 1000000, f'Unexpected size for {filename}'
              durations.append(duration)
              print(filename, info['duration'], info['size'], flush=True)
          assert max(durations) - min(durations) < 0.1, durations
          PY
      - name: Verify wind levels are audible and increase monotonically
        run: |
          python - <<'PY'
          import subprocess, numpy as np
          names = [
              'sleep-background-full.mp3',
              'sleep-background-wind-02.mp3',
              'sleep-background-wind-05.mp3',
              'sleep-background-wind-10.mp3',
              'sleep-background-wind-20.mp3',
          ]
          # In the late tail, Sui has stopped talking and only ambient
          # audio can be present. Use a section away from the final fade.
          def rms(path):
              raw = subprocess.check_output([
                  'ffmpeg', '-hide_banner', '-loglevel', 'error',
                  '-ss', '1450', '-t', '12', '-i', path,
                  '-ac', '1', '-ar', '32000', '-f', 'f32le', 'pipe:1'])
              arr = np.frombuffer(raw, dtype='<f4').astype(np.float64)
              assert arr.size > 300000, f'Invalid sample for {path}'
              return float(np.sqrt(np.mean(arr**2)))
          levels = [rms(path) for path in names]
          print('Wind tail RMS levels:', list(zip(names, levels)))
          assert levels[0] < 0.0006, 'Off should be effectively silent after voice'
          assert 0.002 < levels[1] < levels[2] < levels[3] < levels[4], 'Wind presets must rise audibly'
          assert levels[4] > 0.010, 'Maximum wind should be audible on speakers'
          PY
      - name: Commit audio to public GitHub Pages repository
        run: |
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          git add sleep-background-full.mp3 sleep-background-wind-*.mp3
          git commit -m 'Publish Sui sleep voice with five quiet wind presets for iOS background playback' || exit 0
          git pull --rebase
          git push

      - name: Publish diagnostic log if render failed
        if: failure()
        run: |
          if test -f build-background-debug.txt; then
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git config user.name 'github-actions[bot]'
            git add -f build-background-debug.txt
            git commit -m 'Record background audio renderer failure diagnostics' || exit 0
            git pull --rebase
            git push
          fi
