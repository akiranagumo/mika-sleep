name: Build continuous Sui background sleep audio
concurrency:
  group: sui-background-audio
  cancel-in-progress: true
on:
  push:
    paths:
      - '.github/workflows/build-background-audio.yml'
      - 'scripts/build_background_audio.py'
      - 'sui-count-whisper-japanese.mp3'
      - 'sui-whisper-japanese-segments.json'
      - 'sui-comfort-whispers-v2.mp3'
      - 'sui-comfort-whispers-v2-segments.json'
      - 'sui-japanese-top.mp3'
      - 'sui-english-top.mp3'
      - 'sui-japanese-top-segments.json'
      - 'sui-english-top-segments.json'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout audio sources
        uses: actions/checkout@v4
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install audio builder dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install --disable-pip-version-check 'numpy>=1.26,<3'
          ffmpeg -version | head -n 1
      - name: Render full 32-minute background playback file
        run: |
          set -o pipefail
          python scripts/build_background_audio.py japanese 2>&1 | tee build-background-debug.txt
          python scripts/build_background_audio.py english 2>&1 | tee -a build-background-debug.txt
      - name: Produce 8-second wind-only listening samples
        run: |
          set -euo pipefail
          files=(sleep-background-wind-02.mp3 sleep-background-wind-05.mp3 sleep-background-wind-10.mp3 sleep-background-wind-20.mp3)
          for i in "${!files[@]}"; do
            n=$((i+1))
            ffmpeg -nostdin -y -hide_banner -loglevel error -ss 1450 -t 8 -i "${files[$i]}" -c:a libmp3lame -b:a 96k "wind-preview-${n}.mp3"
            test -s "wind-preview-${n}.mp3"
          done
      - name: Validate MP3 has expected length and non-silent speech
        run: |
          python - <<'PY'
          import json, subprocess
          paths = ['sleep-background-full.mp3','sleep-background-wind-02.mp3',
                   'sleep-background-wind-05.mp3','sleep-background-wind-10.mp3',
                   'sleep-background-wind-20.mp3',
                   'sleep-english-full.mp3','sleep-english-wind-02.mp3',
                   'sleep-english-wind-05.mp3','sleep-english-wind-10.mp3',
                   'sleep-english-wind-20.mp3']
          durations = []
          for filename in paths:
              info = json.loads(subprocess.check_output(
                  ['ffprobe','-v','error','-show_format','-of','json',filename]))['format']
              duration = float(info['duration'])
              assert 1850 < duration < 2100, f'Unexpected duration for {filename}: {duration}'
              assert int(info['size']) > 1000000, f'Unexpected size for {filename}'
              durations.append(duration)
              print(filename, info['duration'], info['size'], flush=True)
          assert max(durations) - min(durations) < 0.1, durations
          PY
      - name: Verify wind levels are audible and increase monotonically
        run: |
          python - <<'PY'
          import subprocess, numpy as np
          names = [
              'sleep-background-full.mp3',
              'sleep-background-wind-02.mp3',
              'sleep-background-wind-05.mp3',
              'sleep-background-wind-10.mp3',
              'sleep-background-wind-20.mp3',
          ]
          # In the late tail, Sui has stopped talking and only ambient
          # audio can be present. Use a section away from the final fade.
          def rms(path):
              raw = subprocess.check_output([
                  'ffmpeg', '-hide_banner', '-loglevel', 'error',
                  '-ss', '1450', '-t', '12', '-i', path,
                  '-ac', '1', '-ar', '32000', '-f', 'f32le', 'pipe:1'])
              arr = np.frombuffer(raw, dtype='<f4').astype(np.float64)
              assert arr.size > 300000, f'Invalid sample for {path}'
              return float(np.sqrt(np.mean(arr**2)))
          levels = [rms(path) for path in names]
          print('Wind tail RMS levels:', list(zip(names, levels)))
          assert levels[0] < 0.0006, 'Off should be effectively silent after voice'
          assert 0.002 < levels[1] < levels[2] < levels[3] < levels[4], 'Wind presets must rise audibly'
          assert levels[4] > 0.010, 'Maximum wind should be audible on speakers'
          PY
      - name: Commit audio to public GitHub Pages repository
        run: |
          set -euo pipefail
          mkdir -p /tmp/sui-publish
          cp sleep-background-full.mp3 sleep-background-wind-*.mp3 sleep-english-full.mp3 sleep-english-wind-*.mp3 wind-preview-*.mp3 /tmp/sui-publish/
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          # Never try to rebase several independently generated large MP3 commits.
          # Base a fresh publish commit on the current origin/main each time.
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/sui-publish/* .
            git add sleep-background-full.mp3 sleep-background-wind-*.mp3 sleep-english-full.mp3 sleep-english-wind-*.mp3 wind-preview-*.mp3
            if git diff --cached --quiet; then
              echo 'Audio is already current'
              exit 0
            fi
            git commit -m 'Publish both Sui Japanese and English countdown modes with adjustable wind'
            if git push origin HEAD:main; then
              echo 'Sui wind files successfully published'
              exit 0
            fi
            echo "Remote main moved during publish; retry $attempt"
            sleep 3
          done
          echo 'Failed to publish audio after retries'
          exit 1

      - name: Publish diagnostic log if render failed
        if: failure()
        run: |
          if test -f build-background-debug.txt; then
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git config user.name 'github-actions[bot]'
            git add -f build-background-debug.txt
            git commit -m 'Record background audio renderer failure diagnostics' || exit 0
            git pull --rebase
            git push
          fi
